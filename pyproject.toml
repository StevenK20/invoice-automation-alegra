[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invoice-bot-alegra"
version = "1.0.0"
description = "Automatic entry of Colombian DIAN supplier e-invoices into Alegra, with validation, layered product matching and a human-review queue."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["defusedxml>=0.7.1", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
invoice-bot = "invoice_bot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
